const jugador = {
    clicksHechos: 0,
    puntosPorClick: 1,
    puntosPorSegundo: 0,
    comprado: 0,
    puntos: 0,
}
function guardarObjetoJugador() {
    localStorage.setItem("jugadorGuardado", JSON.stringify(jugador));
}
function cargarObjetoJugador() {
    let objetoRecuperado = localStorage.getItem("jugadorGuardado")
    let texto = JSON.parse(objetoRecuperado);
if (texto !== null) {
    jugador.clicksHechos = texto.clicksHechos;
    jugador.puntosPorClick = texto.puntosPorClick;
    jugador.puntosPorSegundo = texto.puntosPorSegundo;

    puntosClick.innerHTML = jugador.puntosPorClick + " [POR CLICK]"
    puntosSeg.innerHTML = jugador.puntosPorSegundo + "/SEG"
} else {
    console.log("no hay partida guardada")
}
}
