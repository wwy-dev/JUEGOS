<body style="
    background-color: #0d001a;
    display: flex;
    flex-wrap: wrap; /* Si no cabe en pantalla, la tienda pasa abajo */
    justify-content: center;
    gap: 30px; /* Separación fija entre el juego y la tienda */
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    font-family: sans-serif;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 20px;">
        <div style="
            background-image: linear-gradient(to bottom, rgb(0, 0, 105), rgb(102, 0, 77)); 
            display: flex; 
            width: 400px; 
            max-width: 90vw;
            border-radius: 20px; 
            align-items: center; 
            flex-direction: column;
            justify-content: center; 
            box-shadow: 12px 12px 20px rgba(0, 0, 0, 0.7);">
            <h1 style="color: rgb(252, 252, 252); text-shadow: 0px 0px 3px;">JUEGO CLICKER</h1>
            <button id="volver" style="
                font-size: 16px; 
                border-radius: 20px;
                background-image: linear-gradient(to bottom, rgb(71, 0, 0), rgb(156, 0, 0));
                width: 220px;
                margin-bottom: 20px;
                color: rgb(253, 250, 250);
                cursor: pointer;
                border: none;
                padding: 10px;
                font-weight: bold;">VOLVER AL MENU</button>
        </div>
        <div style="
            background-image: linear-gradient(to bottom, rgb(255, 62, 62), rgb(155, 0, 0));
            display: flex;
            width: 400px;
            max-width: 90vw;
            border-radius: 20px;
            align-items: center;
            flex-direction: column;
            justify-content: center; 
            box-shadow: 12px 12px 20px rgba(0, 0, 0, 0.7);
            padding-bottom: 20px;">
            <div style="
                background-image: linear-gradient(to bottom, rgb(194, 0, 0), rgb(73, 0, 0));
                display: flex;
                width: 90%;
                border-radius: 20px;
                align-items: center;
                flex-direction: column;
                justify-content: center; 
                box-shadow: 12px 12px 20px rgba(0, 0, 0, 0.7);
                margin-top: 20px;">
                <h1 style="color: rgb(255, 255, 255); margin-bottom: 0;">PUNTOS TOTALES</h1>
                <h1 id="puntosTotales" style="font-family:'Franklin Gothic Medium', Arial, sans-serif; color: aqua; margin-top: 10px;">0</h1>
            </div>
            <div style="
                background-image: linear-gradient(to bottom, rgb(194, 0, 0), rgb(73, 0, 0));
                display: flex;
                width: 90%;
                border-radius: 20px;
                align-items: center;
                flex-direction: column;
                justify-content: center; 
                box-shadow: 12px 12px 20px rgba(0, 0, 0, 0.7);
                margin-top: 20px;">
                <h1 style="font-family:'Franklin Gothic Medium', Arial, sans-serif; color: rgb(248, 248, 248); margin-bottom: 0;">PUNTOS POR CLICK</h1>
                <h1 id="puntosPorClicks" style="font-family:'Franklin Gothic Medium', Arial, sans-serif; color: rgb(0, 255, 21); margin-top: 10px;">1</h1>
            </div>
            <div style="
                background-image: linear-gradient(to bottom, rgb(194, 0, 0), rgb(73, 0, 0));
                display: flex;
                width: 90%;
                border-radius: 20px;
                align-items: center;
                flex-direction: column;
                justify-content: center; 
                box-shadow: 12px 12px 20px rgba(0, 0, 0, 0.7);
                margin-top: 20px;">
                <h1 style="font-family:'Franklin Gothic Medium', Arial, sans-serif; color: rgb(248, 248, 248); text-align: center; font-size: 20px; margin-top: 15px;">CLICK PARA GANAR PUNTOS</h1>
                <button id="clickParaGanarPuntos" style="
                    background-image: linear-gradient(to bottom, lime, green);
                    cursor: pointer;
                    width: 150px;
                    height: 70px;
                    border-radius: 20px;
                    margin: 15px 0;
                    font-size: 30px;
                    border: none;
                    color: white;
                    font-weight: bold;
                    box-shadow: 0px 5px 0px darkgreen;">CLICK</button>
            </div>
        </div>
    </div>
    <div style="
        background-image: linear-gradient(to bottom, rgb(0, 47, 150), rgb(0, 52, 112));
        display: flex;
        flex-direction: column;
        width: 280px;
        max-width: 90vw;
        max-height: 85vh;
        overflow-y: auto;
        border-radius: 20px;
        align-items: center;
        box-shadow: 12px 12px 20px rgba(0,0,0,0.5);
        padding: 15px;">
        <h1 style="margin: 0; color: #f8f6f6; font-size: 30px;">TIENDA</h1>
        <h1 style="margin: 0; color: #faf8f8; font-size: 18px; margin-top: 20px;">+1 punto / click</h1>
        <button id="comprar1" style="
            background-image: linear-gradient(to bottom, lime, green);
            cursor: pointer;
            width: 160px;
            height: 50px;
            border-radius: 15px;
            margin: 10px 0;
            font-size: 18px;
            border: none;
            color: white;
            font-weight: bold;">100 CLICKS</button>
        <h1 style="margin: 0; color: #faf8f8; font-size: 18px; margin-top: 15px;">+10 puntos / click</h1>
        <button id="comprar2" style="
            background-image: linear-gradient(to bottom, lime, green);
            cursor: pointer;
            width: 160px;
            height: 50px;
            border-radius: 15px;
            margin: 10px 0;
            font-size: 18px;
            border: none;
            color: white;
            font-weight: bold;">1k CLICKS</button>
        <h1 style="margin: 0; color: #faf8f8; font-size: 18px; margin-top: 15px;">+100 puntos / click</h1>
        <button id="comprar3" style="
            background-image: linear-gradient(to bottom, lime, green);
            cursor: pointer;
            width: 160px;
            height: 50px;
            border-radius: 15px;
            margin: 10px 0;
            font-size: 18px;
            border: none;
            color: white;
            font-weight: bold;">25k CLICKS</button>
        <h1 style="margin: 0; color: #faf8f8; font-size: 18px; margin-top: 15px;">+1000 puntos / click</h1>
        <button id="comprar4" style="
            background-image: linear-gradient(to bottom, lime, green);
            cursor: pointer;
            width: 160px;
            height: 50px;
            border-radius: 15px;
            margin: 10px 0;
            font-size: 18px;
            border: none;
            color: white;
            font-weight: bold;">250k CLICKS</button>
        <h1 style="margin: 0; color: #faf8f8; font-size: 18px; margin-top: 15px;">+10k puntos / click</h1>
        <button id="comprar5" style="
            background-image: linear-gradient(to bottom, lime, green);
            cursor: pointer;
            width: 160px;
            height: 50px;
            border-radius: 15px;
            margin: 10px 0;
            font-size: 18px;
            border: none;
            color: white;
            font-weight: bold;">2.5M CLICKS</button>
        <h1 style="margin: 0; color: #faf8f8; font-size: 18px; margin-top: 15px;">+100k puntos / click</h1>
        <button id="comprar6" style="
            background-image: linear-gradient(to bottom, lime, green);
            cursor: pointer;
            width: 160px;
            height: 50px;
            border-radius: 15px;
            margin: 10px 0;
            font-size: 18px;
            border: none;
            color: white;
            font-weight: bold;">25M CLICKS</button>
    </div>
<script>
let comprar1 = document.getElementById("comprar1");
let comprar2 = document.getElementById("comprar2");
let comprar3 = document.getElementById("comprar3");
let comprar4 = document.getElementById("comprar4");
let comprar5 = document.getElementById("comprar5");
let comprar6 = document.getElementById("comprar6");
let puntosTotales = document.getElementById("puntosTotales");
let puntosPorClick = document.getElementById("puntosPorClicks");
let clickParaGanarPuntos = document.getElementById("clickParaGanarPuntos");
let volver = document.getElementById("volver");
let puntos = 0;
let puntosAlClikear = 1;
if(volver) {
    volver.addEventListener("click", function() {
        window.location.href = "https://wwy-dev.github.io/JUEGOS/";
    });
}
clickParaGanarPuntos.addEventListener("click", function() {
    puntos += puntosAlClikear;
    puntosTotales.innerHTML = puntos.toLocaleString();
});
comprar1.addEventListener("click", function() {
    if (puntos >= 100) {
        puntos -= 100;
        puntosAlClikear += 1;
        puntosTotales.innerHTML = puntos.toLocaleString();
        puntosPorClick.innerHTML = puntosAlClikear.toLocaleString();
    }
});
comprar2.addEventListener("click", function() {
    if (puntos >= 1000) {
        puntos -= 1000;
        puntosAlClikear += 10;
        puntosTotales.innerHTML = puntos.toLocaleString();
        puntosPorClick.innerHTML = puntosAlClikear.toLocaleString();
    }
});
comprar3.addEventListener("click", function() {
    if (puntos >= 25000) {
        puntos -= 25000;
        puntosAlClikear += 100;
        puntosTotales.innerHTML = puntos.toLocaleString();
        puntosPorClick.innerHTML = puntosAlClikear.toLocaleString();
    }
});
comprar4.addEventListener("click", function() {
    if (puntos >= 250000) {
        puntos -= 250000;
        puntosAlClikear += 1000;
        puntosTotales.innerHTML = puntos.toLocaleString();
        puntosPorClick.innerHTML = puntosAlClikear.toLocaleString();
    }
});
comprar5.addEventListener("click", function() {
    if (puntos >= 2500000) {
        puntos -= 2500000;
        puntosAlClikear += 10000;
        puntosTotales.innerHTML = puntos.toLocaleString();
        puntosPorClick.innerHTML = puntosAlClikear.toLocaleString();
    }
});
comprar6.addEventListener("click", function() {
    if (puntos >= 25000000) {
        puntos -= 25000000;
        puntosAlClikear += 100000;
        puntosTotales.innerHTML = puntos.toLocaleString();
        puntosPorClick.innerHTML = puntosAlClikear.toLocaleString();
    }
});
</script>
</body>
</html>
